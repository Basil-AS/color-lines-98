name: CI

# Repository hygiene gate. The web build/tests and the Android build/tests have
# their own workflows (web-ci.yml, android-ci.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Compile Python scripts
        run: uv run python -m py_compile scripts/*.py

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Agent kit self-test
        run: uv run python scripts/self_test.py

      - name: Validate agent state
        run: uv run python scripts/validate_agent_state.py --soft
