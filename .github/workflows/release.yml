name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Check that the tag matches the app versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WEB="$(node -p "require('./package.json').version")"
          ANDROID="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)"
          echo "tag=$VERSION web=$WEB android=$ANDROID"
          test "$VERSION" = "$WEB" && test "$VERSION" = "$ANDROID"

      - name: Build and test the web app
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npx playwright install --with-deps chromium
          npm run e2e
          npm run build

      - name: Package the web app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist && zip -qr "../ColorLines-${VERSION}-web.zip" .)

      - name: Test and build the Android app
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Name the release files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "ColorLines-${VERSION}.apk"
          ls -l ColorLines-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Color Lines ${{ github.ref_name }}
          files: |
            ColorLines-*.apk
            ColorLines-*-web.zip
          generate_release_notes: true
