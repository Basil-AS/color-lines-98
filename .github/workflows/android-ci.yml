name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-candidate:
    if: github.event_name == 'workflow_dispatch'
    needs: check-and-build
    uses: ./.github/workflows/android-candidate.yml
    secrets: inherit

  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install the Android compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Unit and UI tests (JVM)
        working-directory: android
        run: ./gradlew :core-engine:test testDebugUnitTest

      - name: Android lint
        working-directory: android
        run: ./gradlew lintDebug

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/

      - name: Upload the debug APK (install it to try a pull request)
        uses: actions/upload-artifact@v7
        with:
          name: ColorLines-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
