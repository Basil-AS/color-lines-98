name: Stale issues

on:
  schedule:
    - cron: '17 3 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: This issue has been quiet for 60 days; it will close in 14 unless someone comments.
          exempt-issue-labels: pinned,security,bug
